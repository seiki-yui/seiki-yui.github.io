                <style>
                    h1 {
                        font-family: "Lato";

                        /* margin-left: 0.1em; */

                        margin-top: 1.25em;

                    }
                    mark.name {
                        position: relative;
                        display: inline-block;
                        background-color: transparent;
                    }
                    span.mark-content {
                        font-family: "Lato";
                        font-size: 125%;
                        font-weight: 900;
                        letter-spacing: 1.5px;
                    }
                    span.mark-content span.name {
                        color: #CB4042;
                        /* 赤红 AKABENI */
                        /* https://nipponcolors.com/#akabeni */
                    }
                    span.mark-content span.mark {
                        position: absolute;
                        display: block;
                        content: "";
                        top: 56.4%;
                        right: 100%;
                        bottom: 5%;
                        left: 0;
                        z-index: -1;
                        /* background-color: rgba(232, 48, 21, 0.2); */
                        background-color: rgba(240, 96, 72, 0.25);
                        animation: namemark 0.75s cubic-bezier(0.165, 0.84, 0.44, 1.0) 0.75s forwards;
                    }
                    @keyframes namemark {
                        from { right: 100%; } to { right: 0; }
                    }
                    span.pronunciation {
                        display: inline-flex;
                        font-family: "Gentium Plus","Times New Roman", math;
                        font-size: 50%;
                        font-weight: 400;
                        color: #789;
                    }
                    .gimson {
                        transform-origin: 50% 50%;
                        animation: pronunciation-gimson 40s both ease-in 6s infinite;
                    }
                    .ipa {
                        position: relative;
                        left: -50%;
                        transform-origin: 50% 50%;
                        animation: pronunciation-ipa 40s both ease-out 6s infinite;
                    }
                    @keyframes pronunciation-gimson {
                        0%   { transform: rotateY(0deg);  opacity: 1;   }
                        47.5%  { transform: rotateY(0deg);  opacity: 1;   }
                        48.75%  { transform: rotateY(90deg); opacity: 0.2; }
                        98.75%  { transform: rotateY(90deg); opacity: 0.2; }
                        100% { transform: rotateY(0deg);  opacity: 1;   }
                    }
                    @keyframes pronunciation-ipa {
                        0%   { transform: rotateY(90deg);  opacity: 0.2; }
                        48.75%  { transform: rotateY(90deg);  opacity: 0.2; }
                        50%  { transform: rotateY(0deg);   opacity: 1;   }
                        97.5%  { transform: rotateY(0deg);   opacity: 1;   }
                        98.75%  { transform: rotateY(90deg);  opacity: 0.2; }
                        100% { transform: rotateY(90deg);  opacity: 0.2; }
                    }
