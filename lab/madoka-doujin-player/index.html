    <style>
        html,body {

    <style>

        }

            height: 44px;
        }
        #song:has(> .songitem:nth-child(14)) .songitem {
            height: 40px;
        }

            font-weight: 600;

        }
        #song .songitem .length {
            color: #676c75;
            font-weight: 600;

            text-align: right;
        }
    </style>

    <script>

        const query = (it) => document.querySelector(it)
        const style = (it) => window.getComputedStyle(it) 

        var url = 'http://127.0.0.1:5500/x-cdn/2024/madoka-magica-doujin-albums/2025-01-03_without_inst.json'
        var url = 'https://gcore.jsdelivr.net/gh/seiki-yui/x-cdn/2024/madoka-magica-doujin-albums/2025-01-03_without_inst.json'

        let json = fetch(url).then(response => response.json()).then(data => {
            console.log(data)

        for (let i = 0; i < data.length; i++) {
            setTimeout(() => {
                hello(i)
            },6000 * i)
        }

        function step() {
            query("#info").style.left = query("#cover").offsetLeft + query("#cover").offsetWidth / 2 + 75 + "px"
            window.requestAnimationFrame(step);
        }
        window.requestAnimationFrame(step);

        // hello(5)

        function hello (i) {
            item = data[i]

            let album = item.album
            query("#name").innerText    = album.name
            query("#artist").innerText  = album.artist
            query("#date").innerText    = album.date
            // query("#length").innerText  = album.length
            query("#cover").src         = "https://gcore.jsdelivr.net/gh/seiki-yui/x-cdn/2024/madoka-magica-doujin-albums/covers-600px-png/" + album.cover + ".png"

            var str = "";
            var i = 0
            var total_duration = 0
            for (song of item.song) {
                i += 1
                // console.log(song.title,song.duration, song.orig_duration)
                total_duration += song.orig_duration

                str += 
                    `<div class="songitem grid">
                        <div class="index">
                            ${i}
                        </div>
                        <div class="name">
                            ${song.title}
                        </div>
                        <div class="length">
                            ${song.duration}
                        </div>
                    </div>`
            }
            query("#song").innerHTML = str;

                
            
            total_duration = Math.round(total_duration)

            var min = Math.floor(total_duration / 60)
                min = min.toString().padStart(2, "0")
            var second = total_duration % 60
                second = second.toString().padStart(2, "0")

            query("#length").innerHTML = `${min}:${second}`

            // console.log("https://gcore.jsdelivr.net/gh/seiki-yui/x-cdn/2024/madoka-magica-doujin-albums/covers-600px-png/" + album.cover + ".png")
        
        }

            // for (item of data) {
            // // if (true) {
            //     // item = data[21]

                
            // }
            // // 
        })
                
    </script>
