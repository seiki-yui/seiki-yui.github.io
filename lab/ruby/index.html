                font-size: 10.666px;
            }

        <script>
            // var punc = "[`~!@#$%^&*_\\-+=<>?:\\\"{}|,.\\/;'\\[\\]·~！@#￥%……&*（）—\\-+={}|《》？：“”【】、；‘'，。、]"
            // console.log(punc.toString()
            // var regexp = `/((?:[^ぁ-ヾ\s（）])+)[\(（]([ぁ-ヾ]+)[\))]/gm`

            var empty = new RegExp("", "gm")
            let list_regexp = [
                [empty, /((?:[^ぁ-ヾ\s\w（）])+)[(（]([ぁ-ヾ]+)[)）]/gm, empty, "默认	汉字(假名)"],
                [empty, /([^ぁ-ヾ\s\w（）|]+)_([ぁ-ヾ]+)/gm, /{{Photransa\||}}/gm, "萌娘百科	{{Photransa|汉字_假名|}}"],
                [empty, /([^ぁ-ヾ\s\w（）|]+)\|([ぁ-ヾ]+)/gm, /{{photrans2\||}}/gm, "萌娘百科 {{photrans2|汉字|假名|}}"],
                [empty, /([^ぁ-ヾ\s（）|]+)\|([ぁ-ヾ]+)/gm, /{{(photrans|ruby)\||}}/gm, "萌娘百科 {{photrans或ruby|汉字|假名|}}"],
                [empty, /<span class="ruby"><span class="rb">([^ぁ-ヾ\s\w（）]+)<\/span><span class="rt">([ぁ-ヾ]+)<\/span><\/span>/gm, /<br>/gm, "UtaTen    <span class=\"ruby\">"]
            ]

            var ele_edit_regexp_pre = document.getElementById("edit_regexp_pre")
            var ele_edit_regexp = document.getElementById("edit_regexp")
            var ele_edit_regexp_end = document.getElementById("edit_regexp_end")
            var ele_select_regexp = document.getElementById("select_regexp")

            var ele_input_jp = document.getElementById("input_jp")
            var ele_input_cn = document.getElementById("input_cn")
            var ele_check_add_cn = document.getElementById("check_add_cn")

            for (let it of list_regexp) {
                var ele_option = document.createElement("option")
                ele_select_regexp.appendChild(ele_option)
                ele_option.value = it[1].toString()
                var ele_text = document.createTextNode(it[3])
                ele_option.appendChild(ele_text)
            }

            ele_select_regexp.onchange = () => {
                ele_edit_regexp_pre.value = list_regexp[ele_select_regexp.selectedIndex][0].source
                ele_edit_regexp.value     = list_regexp[ele_select_regexp.selectedIndex][1].source
                ele_edit_regexp_end.value = list_regexp[ele_select_regexp.selectedIndex][2].source
                button_onclick()
            }

            button_onclick = function() {
                var ele_output = document.getElementById("output")
                
                if (
                    !(ele_edit_regexp.value.length > 0) 
                    && (ele_edit_regexp.value != "(?:)")
                ) {
                    ele_output.innerHTML = ele_input_jp.value
                    return;
                }

                var regexp_pre = new RegExp(ele_edit_regexp_pre.value, "gm")
                var regexp = new RegExp(ele_edit_regexp.value, "gm")
                var regexp_end = new RegExp(ele_edit_regexp_end.value, "gm")


                function replace_ruby(orig) {
                    var pre = orig.replace(regexp_pre, "")
                    var now = pre.replace(regexp, "<ruby>$1<rp>(</rp><rt>$2</rt><rp>)</rp></ruby>")
                    var end = now.replace(regexp_end, "")
                    return end
                }

                var input_jp = ele_input_jp.value
                var input_cn = ele_input_cn.value
                var is_add_cn = ele_check_add_cn.checked && input_cn.length > 0

                var array_jp = Array.from(input_jp.split("\n"))
                var array_cn = Array.from(input_cn.split("\n"))

                var final = ""

                array_jp.forEach((element, index) => {
                    final += `<span class="jp">${replace_ruby(element)}</span>\n`
                    if (is_add_cn && index < array_cn.length) {
                        final += `<span class="cn">${array_cn[index]}</span>\n`
                    }
                })

                ele_output.innerHTML = final
            }

        </script>

        <script>
            document.getElementById("input_jp").oninput = () => button_onclick()
            document.getElementById("input_cn").oninput = () => button_onclick() 
            document.getElementById("check_add_cn").oninput = () => button_onclick() 
            document.getElementById("edit_regexp_pre").oninput = () => button_onclick()
            document.getElementById("edit_regexp").oninput = () => button_onclick()
            document.getElementById("edit_regexp_end").oninput = () => button_onclick()

            document.getElementById("input_jp").innerHTML = ``

            ele_select_regexp.onchange()
            button_onclick()
            
        </script>
